title: Run Key Persistence Set by Process in User-Writable Path
id: 7c1f3a52-4b8e-4d2a-9e61-3f0a5b7d2c11
status: experimental
description: Detects a process running from a user-writable directory that writes a value under the CurrentVersion\Run key, as done by simple implants with a persistence command.
references:
    - https://attack.mitre.org/techniques/T1547/001/
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection_key:
        TargetObject|contains:
            - '\Software\Microsoft\Windows\CurrentVersion\Run\'
            - '\Software\Microsoft\Windows\CurrentVersion\RunOnce\'
    selection_writer:
        Image|contains:
            - '\Users\Public\'
            - '\AppData\'
            - '\Temp\'
            - '\Downloads\'
            - '\Desktop\'
    selection_value:
        Details|contains:
            - '\Users\Public\'
            - '\AppData\'
            - '\Temp\'
            - '\Downloads\'
            - '\Desktop\'
    filter_known_good:
        Image|endswith:
            - '\OneDrive.exe'
            - '\Teams.exe'
            - '\Update.exe'
    condition: selection_key and (selection_writer or selection_value) and not filter_known_good
falsepositives:
    - Legitimate per-user installers (Discord, Spotify, Teams) that register autostart from AppData
level: medium
